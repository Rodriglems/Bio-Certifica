services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: biocertifica
      POSTGRES_USER: biocertifica
      POSTGRES_PASSWORD: biocertifica_local
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U biocertifica -d biocertifica"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: 3001
      DATABASE_URL: postgres://biocertifica:biocertifica_local@host.docker.internal:55432/biocertifica
      DATABASE_SSL: "false"
      DATABASE_SSL_REJECT_UNAUTHORIZED: "false"
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173,http://localhost,capacitor://localhost,https://biocertifica.com.br
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: biocertificaapp@gmail.com
      SMTP_PASS: sfxrrnftpctxkhmv
      EMAIL_FROM: Bio Certifica <biocertificaapp@gmail.com>
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3001/api/health', r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "3001:3001"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data:
